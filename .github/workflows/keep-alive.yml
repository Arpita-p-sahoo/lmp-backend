name: Keep Render backend awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render's ~15 min sleep timeout
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf https://lmp-backend-1.onrender.com/api \
            && echo "Backend responded OK" \
            || echo "Ping failed (service may be cold-starting or down)"
